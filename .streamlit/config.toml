# StaleBot Streamlit settings.
[browser]
# Don't send usage statistics to Streamlit.
gatherUsageStats = false

[client]
# Hide the developer menu (Deploy, Rerun settings) from visitors.
toolbarMode = "minimal"
# For a public deployment also hide tracebacks from visitors:
# showErrorDetails = "none"

[server]
# Same 8,000-character cap as the dashboard API, with headroom for the form payload (MB).
maxUploadSize = 1
enableXsrfProtection = true
